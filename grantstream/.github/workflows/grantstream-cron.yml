name: Validate GrantStream data

on:
  schedule:
    - cron: "0 9 * * MON"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: grantstream
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate CSV importer
        working-directory: grantstream
        run: python import_csv.py load funders.csv --dry-run --no-init
