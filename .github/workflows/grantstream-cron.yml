name: Grantstream Cron

on:
  schedule:
    - cron: "0 12 * * *" # Runs daily at 12:00 UTC
  workflow_dispatch: {}

concurrency:
  group: grantstream-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-grantstream:
    name: Run scheduled Grantstream task
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run scheduled task
        shell: bash
        run: |
          echo "Grantstream cron ran at $(date -u) on $GITHUB_REPOSITORY"
